[package]
name = "logforge-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["gui"]
gui = ["dep:logforge-gui"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
logforge-core = { path = "../logforge-core" }
logforge-gui = { path = "../logforge-gui", optional = true }
logforge-tui = { path = "../logforge-tui" }
serde_json = "1.0"
