<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1180" role="img" aria-labelledby="title desc">
<title id="title">LogForge-SIEM SQLite data model</title>
<desc id="desc">Real table relationships: sources own events, events_fts indexes event text, events and detection_rules produce alerts, alerts feed the notification outbox and link to cases through case_alerts, and cases have notes. The diagram names every other operational table and overview view.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#1e293b"/></marker></defs>
<rect width="420" height="1260" fill="#f8fafc"/>
<text x="24" y="38" fill="#0B0F14" font-family="sans-serif" font-size="22" font-weight="700">SQLite records and relations</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="24" y="60" width="372" height="66" rx="10" fill="#1e293b"/><text x="210" y="85" fill="#ffffff" font-size="15" font-weight="700">sources</text><text x="210" y="109" fill="#ffffff" font-size="12">id · name · kind · enabled</text>
<path d="M210 126v20" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="141" text-anchor="start" fill="#0B0F14" font-size="10">source_id</text>
<rect x="24" y="150" width="372" height="78" rx="10" fill="#1e293b"/><text x="210" y="175" fill="#ffffff" font-size="15" font-weight="700">events</text><text x="210" y="199" fill="#ffffff" font-size="12">timestamp_utc · severity · host · service</text><text x="210" y="218" fill="#ffffff" font-size="11">message · raw_line · fields_json · dedup_hash</text>
<path d="M210 228v20" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="243" text-anchor="start" fill="#0B0F14" font-size="10">indexed searchable content</text>
<rect x="24" y="252" width="372" height="62" rx="10" fill="#f59e0b"/><text x="210" y="277" fill="#0B0F14" font-size="15" font-weight="700">events_fts · FTS5 index</text><text x="210" y="299" fill="#0B0F14" font-size="11">message, host, service and searchable fields</text>
<rect x="24" y="336" width="372" height="74" rx="10" fill="#1e293b"/><text x="210" y="361" fill="#ffffff" font-size="15" font-weight="700">detection_rules + events</text><text x="210" y="385" fill="#ffffff" font-size="12">rule_engine evaluates enabled patterns in ingest transaction</text>
<path d="M210 410v20" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/><text x="32" y="425" text-anchor="start" fill="#0B0F14" font-size="10">rule_id · event_id · severity</text>
<rect x="24" y="434" width="372" height="66" rx="10" fill="#1e293b"/><text x="210" y="459" fill="#ffffff" font-size="15" font-weight="700">alerts</text><text x="210" y="483" fill="#ffffff" font-size="12">status · title · workflow timestamps</text>
<path d="M210 500v12H111v12" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M210 500v12h99v12" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="524" width="174" height="66" rx="10" fill="#f59e0b"/><text x="111" y="549" fill="#0B0F14" font-size="13" font-weight="700">notification_outbox</text><text x="111" y="573" fill="#0B0F14" font-size="11">alert_id · delivery state</text>
<rect x="222" y="524" width="174" height="66" rx="10" fill="#1e293b"/><text x="309" y="549" fill="#ffffff" font-size="14" font-weight="700">case_alerts</text><text x="309" y="573" fill="#ffffff" font-size="11">case_id · alert_id</text>
<path d="M309 590v20H210v10" fill="none" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="624" width="372" height="66" rx="10" fill="#1e293b"/><text x="210" y="649" fill="#ffffff" font-size="15" font-weight="700">cases + case_notes</text><text x="210" y="673" fill="#ffffff" font-size="12">status · priority · assignee · author · body</text>
<rect x="24" y="718" width="372" height="170" rx="10" fill="#1e293b"/><text x="210" y="745" fill="#ffffff" font-size="15" font-weight="700">Detection, notification and policy state</text><text x="210" y="772" fill="#ffffff" font-size="12">notification_rules · correlation_rules</text><text x="210" y="796" fill="#ffffff" font-size="12">correlation_state · retention_policies</text><text x="210" y="820" fill="#ffffff" font-size="12">settings · saved_queries · category_colors</text><text x="210" y="844" fill="#ffffff" font-size="12">persistent detection windows and local preferences</text><text x="210" y="868" fill="#ffffff" font-size="11">unique rule and category keys enforce stable identity</text>
<rect x="24" y="912" width="372" height="142" rx="10" fill="#1e293b"/><text x="210" y="939" fill="#ffffff" font-size="15" font-weight="700">Audit and ingestion operations</text><text x="210" y="966" fill="#ffffff" font-size="12">audit_log · ingestion_stats · malformed_events</text><text x="210" y="990" fill="#ffffff" font-size="12">append-only hash chain · source counters · bounded failures</text><text x="210" y="1014" fill="#ffffff" font-size="12">v_overview_counts · v_top_sources</text><text x="210" y="1038" fill="#ffffff" font-size="12">v_alerts_by_severity · read-only reporting views</text>
<rect x="24" y="1078" width="372" height="70" rx="10" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/><text x="210" y="1104" fill="#0B0F14" font-size="14" font-weight="700">All records are local to logforge-siem.db</text><text x="210" y="1128" fill="#0B0F14" font-size="11">Foreign keys and migration history preserve relations.</text>
</g>
</svg>
