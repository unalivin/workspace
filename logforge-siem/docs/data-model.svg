<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-label="LogForge-SIEM SQLite data model">
  <style>
    :root { --bg: #ffffff; --box: #f4f6f8; --stroke: #334155; --accent: #fef3c7; --accent-stroke: #d97706; --text: #0f172a; --line: #475569; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --box: #1e293b; --stroke: #94a3b8; --accent: #451a03; --accent-stroke: #f59e0b; --text: #f8fafc; --line: #cbd5e1; }
    }
    rect.bg { fill: var(--bg); }
    rect.tbl { fill: var(--box); stroke: var(--stroke); stroke-width: 2; rx: 8; ry: 8; }
    rect.view { fill: var(--accent); stroke: var(--accent-stroke); stroke-width: 2; rx: 8; ry: 8; }
    text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: var(--text); text-anchor: middle; dominant-baseline: middle; }
    line.arrow { stroke: var(--line); stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--line)" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="360" />
  <rect class="tbl" x="30" y="30" width="180" height="72" />
  <text x="120" y="54">sources</text>
  <text x="120" y="78">id, name, kind, enabled</text>
  <rect class="tbl" x="270" y="30" width="180" height="72" />
  <text x="360" y="54">events</text>
  <text x="360" y="78">id, source_id, dedup_hash</text>
  <rect class="tbl" x="510" y="30" width="180" height="72" />
  <text x="600" y="54">alerts</text>
  <text x="600" y="78">id, rule_id, event_id</text>
  <rect class="tbl" x="510" y="150" width="180" height="72" />
  <text x="600" y="174">detection_rules</text>
  <text x="600" y="198">id, name, severity</text>
  <rect class="view" x="150" y="250" width="420" height="64" />
  <text x="360" y="282">v_overview_counts (Overview screen)</text>
  <line class="arrow" x1="210" y1="66" x2="268" y2="66" />
  <line class="arrow" x1="450" y1="66" x2="508" y2="66" />
  <line class="arrow" x1="600" y1="150" x2="600" y2="104" />
</svg>
