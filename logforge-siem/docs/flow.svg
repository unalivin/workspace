<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 1060" role="img" aria-labelledby="title desc">
<title id="title">One demo log line through LogForge-SIEM</title>
<desc id="desc">A specific synthetic SSH failure line travels from the demo-auth source through logforge-app, logforge-core service, parser, timestamp normalization, secret redaction and deduplication. Accepted normalized event data is committed to SQLite and FTS5, then the rule engine matches Failed password and writes an alert and audit record.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#1e293b"/></marker></defs>
<rect width="420" height="1060" fill="#f8fafc"/>
<text x="24" y="36" fill="#0B0F14" font-family="sans-serif" font-size="22" font-weight="700">One line, source to alert</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="24" y="58" width="372" height="104" rx="12" fill="#1e293b"/><text x="210" y="83" fill="#ffffff" font-size="15" font-weight="700">Demo source: demo-auth</text><text x="210" y="108" fill="#ffffff" font-size="13">synthetic line stream</text><text x="210" y="126" fill="#ffffff" font-size="10">2026-11-21T08:00:00Z web-01 sshd: Failed password</text><text x="210" y="142" fill="#ffffff" font-size="10">for invalid user admin</text>
<path d="M360 162v8" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/><text x="34" y="169" text-anchor="start" fill="#0B0F14" font-size="10">line + source id</text>
<rect x="24" y="176" width="372" height="76" rx="12" fill="#1e293b"/><text x="210" y="202" fill="#ffffff" font-size="15" font-weight="700">logforge-app / Ingest command</text><text x="210" y="228" fill="#ffffff" font-size="12">selects source and parser format</text>
<path d="M360 252v28" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/><text x="36" y="273" text-anchor="start" fill="#0B0F14" font-size="10">bounded batch</text>
<rect x="24" y="286" width="372" height="76" rx="12" fill="#1e293b"/><text x="210" y="312" fill="#ffffff" font-size="15" font-weight="700">logforge-core::service::ingest_batch</text><text x="210" y="338" fill="#ffffff" font-size="12">parses each record through parser_suite</text>
<path d="M360 362v28" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/><text x="36" y="383" text-anchor="start" fill="#0B0F14" font-size="10">NormalizedEvent</text>
<rect x="24" y="396" width="372" height="86" rx="12" fill="#1e293b"/><text x="210" y="422" fill="#ffffff" font-size="15" font-weight="700">parser_suite + timestamp + ingest</text><text x="210" y="448" fill="#ffffff" font-size="12">UTC timestamp; severity=warn; host=web-01;</text><text x="210" y="468" fill="#ffffff" font-size="12">service=sshd; secret redaction applied</text>
<path d="M360 482v28" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/><text x="36" y="503" text-anchor="start" fill="#0B0F14" font-size="10">dedup hash + normalized fields</text>
<rect x="24" y="516" width="372" height="76" rx="12" fill="#1e293b"/><text x="210" y="542" fill="#ffffff" font-size="15" font-weight="700">logforge-core::service + SQLite</text><text x="210" y="568" fill="#ffffff" font-size="12">dedup check, transaction, events + events_fts</text>
<path d="M360 592v28" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/><text x="36" y="613" text-anchor="start" fill="#0B0F14" font-size="10">message + severity + event id</text>
<rect x="24" y="626" width="372" height="76" rx="12" fill="#1e293b"/><text x="210" y="652" fill="#ffffff" font-size="15" font-weight="700">logforge-core::rule_engine</text><text x="210" y="678" fill="#ffffff" font-size="12">enabled rule “Failed SSH login” matches</text>
<path d="M360 702v28" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/><text x="36" y="723" text-anchor="start" fill="#0B0F14" font-size="10">rule id + event id + title</text>
<rect x="24" y="736" width="372" height="86" rx="12" fill="#f59e0b"/><text x="210" y="763" fill="#0B0F14" font-size="15" font-weight="700">alerts + audit_log in same ingest flow</text><text x="210" y="789" fill="#0B0F14" font-size="12">alert: warn · Failed SSH login: web-01</text><text x="210" y="809" fill="#0B0F14" font-size="12">event remains searchable and traceable</text>
<path d="M360 822v28" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/><text x="230" y="843" fill="#0B0F14" font-size="11">query against committed records</text>
<rect x="24" y="856" width="372" height="76" rx="12" fill="#1e293b"/><text x="210" y="882" fill="#ffffff" font-size="15" font-weight="700">Search, Alerts, Cases, Reports</text><text x="210" y="908" fill="#ffffff" font-size="12">GUI, TUI and CLI use the same service</text>
<rect x="24" y="954" width="372" height="76" rx="12" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/><text x="210" y="981" fill="#0B0F14" font-size="14" font-weight="700">Persistent records stay in logforge-siem.db</text><text x="210" y="1008" fill="#0B0F14" font-size="12">No external destination is needed.</text>
</g>
</svg>
