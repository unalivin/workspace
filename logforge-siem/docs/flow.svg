<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-label="LogForge-SIEM data flow from ingestion to search and alerts">
  <style>
    :root { --bg: #ffffff; --box: #f4f6f8; --stroke: #334155; --accent: #fef3c7; --accent-stroke: #d97706; --text: #0f172a; --line: #475569; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --box: #1e293b; --stroke: #94a3b8; --accent: #451a03; --accent-stroke: #f59e0b; --text: #f8fafc; --line: #cbd5e1; }
    }
    rect.bg { fill: var(--bg); }
    rect.node { fill: var(--box); stroke: var(--stroke); stroke-width: 2; rx: 8; ry: 8; }
    rect.end { fill: var(--accent); stroke: var(--accent-stroke); stroke-width: 2; rx: 8; ry: 8; }
    text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: var(--text); text-anchor: middle; dominant-baseline: middle; }
    line.arrow { stroke: var(--line); stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--line)" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="420" />
  <rect class="node" x="160" y="20" width="400" height="48" />
  <text x="360" y="44">1. Ingest: JSON lines / syslog (max 64 KB)</text>
  <rect class="node" x="160" y="92" width="400" height="48" />
  <text x="360" y="116">2. Redact &amp; Normalize: UTC timestamp, [REDACTED]</text>
  <rect class="node" x="160" y="164" width="400" height="48" />
  <text x="360" y="188">3. Deduplicate: SHA-256 hash check</text>
  <rect class="node" x="160" y="236" width="400" height="48" />
  <text x="360" y="260">4. Store &amp; Index: SQLite events + events_fts</text>
  <rect class="end" x="160" y="308" width="400" height="72" />
  <text x="360" y="332">5. Where it ends: Search, Alerts, GUI/TUI/CLI</text>
  <text x="360" y="356">Stored locally in logforge-siem.db</text>
  <line class="arrow" x1="360" y1="68" x2="360" y2="90" />
  <line class="arrow" x1="360" y1="140" x2="360" y2="162" />
  <line class="arrow" x1="360" y1="212" x2="360" y2="234" />
  <line class="arrow" x1="360" y1="284" x2="360" y2="306" />
</svg>
