<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" role="img" aria-labelledby="title desc">
<title id="title">LogForge-SIEM local architecture</title>
<desc id="desc">The app crate provides CLI and mode selection, GUI and TUI crates call the same core service, the core contains ingestion, query, detection, cases, retention, audit and analytics modules, and migrations define a local SQLite database. Optional file ingestion reads only configured paths; no service is required for offline use.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9z" fill="#1e293b"/></marker></defs>
<rect width="420" height="900" fill="#f8fafc"/>
<text x="24" y="38" fill="#0B0F14" font-family="sans-serif" font-size="22" font-weight="700">Local architecture</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="24" y="68" width="372" height="96" rx="12" fill="#1e293b"/><text x="210" y="97" fill="#ffffff" font-size="16" font-weight="700">Input</text><text x="210" y="124" fill="#ffffff" font-size="13">configured log files · demo stream · CLI</text><text x="210" y="146" fill="#ffffff" font-size="12">bounded lines, explicit parser format</text>
<path d="M210 164v28" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="198" width="372" height="104" rx="12" fill="#1e293b"/><text x="210" y="227" fill="#ffffff" font-size="16" font-weight="700">logforge-app</text><text x="210" y="253" fill="#ffffff" font-size="13">CLI arguments · validation · launch routing</text><text x="210" y="278" fill="#ffffff" font-size="12">commands call logforge-core services</text>
<path d="M210 302v28" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="336" width="372" height="120" rx="12" fill="#1e293b"/><text x="210" y="365" fill="#ffffff" font-size="16" font-weight="700">Presentation clients</text><text x="210" y="391" fill="#ffffff" font-size="13">logforge-gui · eframe / egui</text><text x="210" y="415" fill="#ffffff" font-size="13">logforge-tui · ratatui / crossterm</text><text x="210" y="439" fill="#ffffff" font-size="12">same data and service APIs; no duplicate store</text>
<path d="M210 456v28" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="490" width="372" height="178" rx="12" fill="#1e293b"/><text x="210" y="519" fill="#ffffff" font-size="16" font-weight="700">logforge-core</text><text x="210" y="545" fill="#ffffff" font-size="12">service · parser_suite · ingest · timestamp</text><text x="210" y="569" fill="#ffffff" font-size="12">event_query · query_language · query_report</text><text x="210" y="593" fill="#ffffff" font-size="12">rule_engine · correlation_state · cases</text><text x="210" y="617" fill="#ffffff" font-size="12">notifier · retention · audit_verify · analytics</text><text x="210" y="643" fill="#ffffff" font-size="12">transactions, bounds, redaction, deterministic APIs</text>
<path d="M210 668v28" stroke="#1e293b" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="24" y="702" width="372" height="112" rx="12" fill="#f59e0b"/><text x="210" y="731" fill="#0B0F14" font-size="16" font-weight="700">SQLite: logforge-siem.db</text><text x="210" y="757" fill="#0B0F14" font-size="13">migrations · events_fts · alerts · cases</text><text x="210" y="781" fill="#0B0F14" font-size="13">audit chain · correlation state · outbox</text><text x="210" y="801" fill="#0B0F14" font-size="11">stored on this machine</text>
<rect x="24" y="844" width="372" height="38" rx="9" fill="#f8fafc" stroke="#1e293b" stroke-width="2"/><text x="210" y="868" fill="#0B0F14" font-size="12">Optional network features stay off unless explicitly enabled</text>
</g>
</svg>
