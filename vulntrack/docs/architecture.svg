<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" role="img" aria-label="VulnTrack architecture">
  <style>
    :root { --bg: #ffffff; --box: #f4f6f8; --stroke: #334155; --accent: #fee2e2; --accent-stroke: #dc2626; --text: #0f172a; --line: #475569; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f172a; --box: #1e293b; --stroke: #94a3b8; --accent: #450a0a; --accent-stroke: #ef4444; --text: #f8fafc; --line: #cbd5e1; }
    }
    rect.bg { fill: var(--bg); }
    rect.node { fill: var(--box); stroke: var(--stroke); stroke-width: 2; rx: 8; ry: 8; }
    rect.core { fill: var(--accent); stroke: var(--accent-stroke); stroke-width: 2; rx: 8; ry: 8; }
    text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: var(--text); text-anchor: middle; dominant-baseline: middle; }
    line.arrow { stroke: var(--line); stroke-width: 2; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--line)" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="720" height="240" />
  <rect class="node" x="30" y="92" width="140" height="56" />
  <text x="100" y="120">Scan Importers</text>
  <rect class="core" x="230" y="92" width="180" height="56" />
  <text x="320" y="120">service + SQLite</text>
  <rect class="node" x="480" y="24" width="190" height="48" />
  <text x="575" y="48">Desktop GUI (Fyne)</text>
  <rect class="node" x="480" y="96" width="190" height="48" />
  <text x="575" y="120">Terminal UI (Bubble Tea)</text>
  <rect class="node" x="480" y="168" width="190" height="48" />
  <text x="575" y="192">CLI (cmd/vulntrack)</text>
  <line class="arrow" x1="170" y1="120" x2="228" y2="120" />
  <line class="arrow" x1="410" y1="108" x2="478" y2="48" />
  <line class="arrow" x1="410" y1="120" x2="478" y2="120" />
  <line class="arrow" x1="410" y1="132" x2="478" y2="192" />
</svg>
