[workspace]
resolver = "3"
members = ["crates/secretsentry-core", "crates/secretsentry-app", "crates/secretsentry-gui", "crates/secretsentry-tui"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.100"
license = "MIT"
authors = ["Unalivin"]
repository = "https://github.com/unalivin/workspace"
publish = false

[workspace.dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
eframe = "=0.37.0"
egui = { version = "=0.37.0", features = ["default_fonts"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
getrandom = "=0.4.3"
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
regex = "=1.13.1"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
unicode-width = "=0.2.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.dev.package.secretsentry-gui]
opt-level = 2

[profile.release]
lto = "thin"
strip = "symbols"
