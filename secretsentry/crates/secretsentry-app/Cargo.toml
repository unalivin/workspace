[package]
name = "secretsentry-app"
description = "Local-first secret scanner for source trees and Git history: finds likely credentials with tuned rules, redacts values in every output and tracks triage decisions. Desktop GUI, terminal UI and CLI. Never transmits or stores a full secret."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "secretsentry"
path = "src/main.rs"

[lib]
name = "app_cli"

[lints]
workspace = true

[features]
default = ["gui"]
gui = ["dep:app_gui"]

[dependencies]
app_core = { package = "secretsentry-core", path = "../secretsentry-core" }
app_gui = { package = "secretsentry-gui", path = "../secretsentry-gui", optional = true }
app_tui = { package = "secretsentry-tui", path = "../secretsentry-tui" }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[package.metadata.bundle]
name = "SecretSentry"
identifier = "io.github.unalivin.secretsentry"
icon = ["assets/icon.icns"]
copyright = "Copyright (c) 2026 Unalivin"
short_description = "Secret Detection and Triage"
