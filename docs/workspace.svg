<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Monorepo structure: registry, templates, workflows, projects, and split step">
  <style>
    :root {
      --bg: #ffffff;
      --box-bg: #f4f6f8;
      --box-stroke: #334155;
      --accent-bg: #e0f2fe;
      --accent-stroke: #0369a1;
      --text: #0f172a;
      --line: #475569;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --box-bg: #1e293b;
        --box-stroke: #94a3b8;
        --accent-bg: #0c4a6e;
        --accent-stroke: #38bdf8;
        --text: #f8fafc;
        --line: #cbd5e1;
      }
    }
    rect.bg { fill: var(--bg); }
    rect.node { fill: var(--box-bg); stroke: var(--box-stroke); stroke-width: 2; rx: 8; ry: 8; }
    rect.accent { fill: var(--accent-bg); stroke: var(--accent-stroke); stroke-width: 2; rx: 8; ry: 8; }
    text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: var(--text); text-anchor: middle; dominant-baseline: middle; }
    text.small { font-size: 12px; }
    line.arrow { stroke: var(--line); stroke-width: 2; marker-end: url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="var(--line)" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="760" height="260" />

  <rect class="accent" x="30" y="30" width="170" height="56" />
  <text x="115" y="58">scripts/projects.tsv</text>

  <rect class="node" x="30" y="150" width="170" height="56" />
  <text x="115" y="178">templates/</text>

  <rect class="node" x="280" y="30" width="190" height="56" />
  <text x="375" y="58">.github/workflows/</text>

  <rect class="accent" x="280" y="150" width="190" height="56" />
  <text x="375" y="178">&lt;project&gt;/</text>

  <rect class="node" x="550" y="90" width="180" height="56" />
  <text x="640" y="118">Standalone Repo</text>

  <line class="arrow" x1="200" y1="58" x2="278" y2="58" />
  <line class="arrow" x1="115" y1="86" x2="115" y2="148" />
  <line class="arrow" x1="200" y1="178" x2="278" y2="178" />
  <line class="arrow" x1="470" y1="178" x2="548" y2="128" />
  <line class="arrow" x1="470" y1="58" x2="548" y2="108" />
</svg>
