name: CI __NAME__

on:
  push:
    branches:
      - '**'
    paths:
      - '__PATH_FILTER__'
      - '__SELF__'
  pull_request:
    paths:
      - '__PATH_FILTER__'
      - '__SELF__'

permissions:
  contents: read

concurrency:
  group: ci-__NAME__-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: __WORKDIR__

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache-dependency-path: __WORKDIR__/go.sum
      - name: Install prerequisites
        run: scripts/ci-step.sh --command "install prerequisites" scripts/dev-setup.sh --install
      - name: Format
        run: scripts/ci-step.sh fmt-check
      - name: Lint
        run: scripts/ci-step.sh lint
      - name: Test
        run: scripts/ci-step.sh test
      - name: Race detector
        run: scripts/ci-step.sh race-or-sanitize
      - name: Build dashboard
        run: scripts/ci-step.sh build
      - name: Build and test without GUI
        run: scripts/ci-step.sh build-nogui test-nogui
      - name: Vulnerability scan
        run: scripts/ci-step.sh vuln
      - name: Shell scripts
        if: runner.os == 'Linux'
        run: scripts/ci-step.sh shell
      - name: Render dashboard screens
        run: scripts/ci-step.sh screenshots
      - name: Package
        run: scripts/ci-step.sh package
      - name: Upload rendered screens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: __NAME__-screens-${{ matrix.os }}
          path: __WORKDIR__/dist/screens
          if-no-files-found: warn
          retention-days: 14
