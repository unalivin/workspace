name: Root checks

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: root-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: root checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install shell tooling
        run: scripts/install-shell-tools.sh
      - name: Lint scripts
        run: make lint
      - name: Check script formatting
        run: make fmt-check
      - name: Test scripts
        run: make test
      - name: Verify repository
        run: make verify
