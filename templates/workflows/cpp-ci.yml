name: CI {{PROJECT}}

on:
  push:
    paths:
      - '{{PROJECT}}/**'
  pull_request:
    paths:
      - '{{PROJECT}}/**'

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: {{PROJECT}}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Configure and test (nogui)
        run: |
          cmake -B build-nogui -G Ninja -DPROJECT_GUI=OFF
          cmake --build build-nogui
          ctest --test-dir build-nogui --output-on-failure
      - name: Configure and test (default)
        run: |
          cmake -B build -G Ninja
          cmake --build build
          ctest --test-dir build --output-on-failure
