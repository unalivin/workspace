test = false
doc = false
bench = false

[[bin]]
name = "notify_safe_title"
path = "fuzz_targets/notify_safe_title.rs"
test = false
doc = false
bench = false

[[bin]]
name = "records_search_expression"
path = "fuzz_targets/records_search_expression.rs"
test = false
doc = false
bench = false

[[bin]]
name = "settings_normalize"
path = "fuzz_targets/settings_normalize.rs"
test = false
