[package]
name = "templateapp-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
app_core = { package = "templateapp-core", path = "../crates/templateapp-core" }
libfuzzer-sys = "=0.4.13"
rusqlite = { version = "=0.43.0", features = ["bundled"] }

[[bin]]
name = "clock_parse"
path = "fuzz_targets/clock_parse.rs"
