[workspace]
resolver = "3"
members = ["crates/templateapp-core", "crates/templateapp-app"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/unalivin/workspace"
publish = false

[workspace.dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
strip = "symbols"
