[workspace]
resolver = "3"
members = ["crates/templateapp-core", "crates/templateapp-app", "crates/templateapp-gui", "crates/templateapp-tui"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/unalivin/workspace"
publish = false

[workspace.dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
eframe = "=0.37.0"
egui = { version = "=0.37.0", features = ["default_fonts"] }
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
unicode-width = "=0.2.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "thin"
strip = "symbols"
