[package]
name = "templateapp-app"
description = "TEMPLATE_DESCRIPTION"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "templateapp"
path = "src/main.rs"

[lib]
name = "app_cli"

[lints]
workspace = true

[features]
default = ["gui"]
gui = ["dep:app_gui"]

[dependencies]
app_core = { package = "templateapp-core", path = "../templateapp-core" }
app_gui = { package = "templateapp-gui", path = "../templateapp-gui", optional = true }
app_tui = { package = "templateapp-tui", path = "../templateapp-tui" }
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[package.metadata.bundle]
name = "Template App"
identifier = "io.github.unalivin.templateapp"
icon = ["assets/icon.icns"]
short_description = "TEMPLATE_TAGLINE"
