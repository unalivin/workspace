name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: project
    attributes:
      label: Project folder
      placeholder: certwatch
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste the preview shown by About, "Found a bug? Please report it on GitHub." or the output of the diagnostics command. Remove anything private.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
