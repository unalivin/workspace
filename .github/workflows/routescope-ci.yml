name: CI routescope

on:
  push:
    paths:
      - 'routescope/**'
      - 'scripts/ci-check.sh'
  pull_request:
    paths:
      - 'routescope/**'
      - 'scripts/ci-check.sh'

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: routescope
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Configure (no-gui)
        run: ../scripts/ci-check.sh 'configure no-gui' cmake -B build-nogui -G Ninja -DPROJECT_GUI=OFF
      - name: Build (no-gui)
        run: ../scripts/ci-check.sh 'build no-gui' cmake --build build-nogui
      - name: Test (no-gui)
        run: ../scripts/ci-check.sh 'test no-gui' ctest --test-dir build-nogui --output-on-failure
      - name: Configure (default)
        run: ../scripts/ci-check.sh 'configure default' cmake -B build -G Ninja
      - name: Build (default)
        run: ../scripts/ci-check.sh 'build default' cmake --build build
      - name: Test (default)
        run: ../scripts/ci-check.sh 'test default' ctest --test-dir build --output-on-failure
