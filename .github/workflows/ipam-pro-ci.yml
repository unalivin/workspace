name: CI ipam-pro

on:
  push:
    paths:
      - 'ipam-pro/**'
      - 'scripts/ci-check.sh'
  pull_request:
    paths:
      - 'ipam-pro/**'
      - 'scripts/ci-check.sh'

permissions:
  contents: write

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ipam-pro
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Format source
        run: |
          gofmt -w .
          if ! git diff --quiet -- 'ipam-pro'; then
            git config user.name Unalivin
            git config user.email automation
            git add 'ipam-pro'
            git commit -m 'style(ipam-pro): format'
            git push
          fi
      - name: Format check
        run: ../scripts/ci-check.sh gofmt bash -c 'test -z "$(gofmt -l .)"'
      - name: Vet
        run: ../scripts/ci-check.sh vet go vet ./...
      - name: Build
        run: ../scripts/ci-check.sh build go build ./...
      - name: Test (nogui)
        run: ../scripts/ci-check.sh 'test nogui' go test -tags nogui ./...
      - name: Test (default)
        run: ../scripts/ci-check.sh 'test default' go test -race ./...
