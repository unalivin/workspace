name: CI phishlens

on:
  push:
    paths:
      - 'phishlens/**'
      - 'scripts/ci-check.sh'
  pull_request:
    paths:
      - 'phishlens/**'
      - 'scripts/ci-check.sh'

permissions:
  contents: write

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: phishlens
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.83.0
        with:
          components: rustfmt, clippy
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev
      - name: Format source
        run: |
          ../scripts/ci-check.sh 'format source' cargo fmt --all
          if [[ "$RUNNER_OS" == Linux ]] && ! git diff --quiet -- .; then
            git config user.name Unalivin
            git config user.email automation
            git add .
            git commit -m 'style(phishlens): format'
            git push
          fi
      - name: Format check
        run: ../scripts/ci-check.sh 'cargo fmt' cargo fmt --all -- --check
      - name: Clippy
        run: ../scripts/ci-check.sh clippy cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: ../scripts/ci-check.sh build cargo build --workspace --no-default-features
      - name: Test (no-gui)
        run: ../scripts/ci-check.sh 'test no-gui' cargo test --workspace --no-default-features
      - name: Test (default)
        run: ../scripts/ci-check.sh 'test default' cargo test --workspace
