name: CI template-cpp

on:
  push:
    branches:
      - '**'
    paths:
      - 'templates/cpp/**'
      - '.github/workflows/template-cpp-ci.yml'
  pull_request:
    paths:
      - 'templates/cpp/**'
      - '.github/workflows/template-cpp-ci.yml'

permissions:
  contents: read

concurrency:
  group: ci-template-cpp-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: templates/cpp

env:
  VCPKG_DISABLE_METRICS: '1'
  CTEST_OUTPUT_ON_FAILURE: '1'

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            templates/cpp/.tools/vcpkg-cache
          key: template-cpp-vcpkg-${{ runner.os }}-${{ hashFiles('templates/cpp/vcpkg.json', 'templates/cpp/vcpkg-configuration.json', 'templates/cpp/third_party/vcpkg-ports/**', 'templates/cpp/scripts/lib.sh') }}
      - name: Install prerequisites
        run: scripts/ci-step.sh --command "install prerequisites" scripts/dev-setup.sh --install
      - name: Format
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh fmt-check
      - name: Lint
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh lint lint-gui
      - name: Test
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh test
      - name: Sanitizer
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh race-or-sanitize
      - name: Build dashboard
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh build
      - name: Open the dashboard window
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: scripts/ci-step.sh window-check
      - name: Build and test without GUI
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh build-nogui test-nogui
      - name: Generated files
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh docs-check assets-check notices-check
      - name: Supply chain
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: scripts/ci-step.sh vuln
      - name: Fuzz targets
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: scripts/ci-step.sh fuzz
      - name: Shell scripts
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: scripts/ci-step.sh shell
      - name: Render dashboard screens
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh screenshots
      - name: Package
        if: ${{ !cancelled() }}
        run: scripts/ci-step.sh package
      - name: Upload rendered screens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: template-cpp-screens-${{ matrix.os }}
          path: templates/cpp/dist/screens
          if-no-files-found: warn
          retention-days: 14
