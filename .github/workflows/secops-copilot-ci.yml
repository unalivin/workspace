name: CI secops-copilot

on:
  push:
    paths:
      - 'secops-copilot/**'
      - 'scripts/ci-check.sh'
      - '.github/workflows/secops-copilot-ci.yml'
      - 'templates/workflows/go-ci.yml'
  pull_request:
    paths:
      - 'secops-copilot/**'
      - 'scripts/ci-check.sh'
      - '.github/workflows/secops-copilot-ci.yml'
      - 'templates/workflows/go-ci.yml'

permissions:
  contents: write

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: secops-copilot
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
      - name: Format source
        run: |
          ../scripts/ci-check.sh 'format source' bash -c 'find . -name "*.go" -type f -print0 | xargs -0 gofmt -w'
          if [[ "$RUNNER_OS" == Linux ]] && ! git diff --quiet -- .; then
            git config user.name Unalivin
            git config user.email automation
            git add .
            git commit -m 'style(secops-copilot): format'
            git push
          fi
      - name: Format check
        run: ../scripts/ci-check.sh gofmt bash -c 'test -z "$(gofmt -l .)"'
      - name: Vet
        run: ../scripts/ci-check.sh vet go vet ./...
      - name: Build
        run: ../scripts/ci-check.sh build go build ./...
      - name: Test (nogui)
        run: ../scripts/ci-check.sh 'test nogui' go test -tags nogui ./...
      - name: Test (default)
        run: ../scripts/ci-check.sh 'test default' go test -race ./...
