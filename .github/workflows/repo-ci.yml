name: CI workspace

on:
  push:
    paths:
      - 'scripts/**'
      - 'templates/**'
      - 'README.md'
      - 'Makefile'
      - '.github/workflows/repo-ci.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'templates/**'
      - 'README.md'
      - 'Makefile'
      - '.github/workflows/repo-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository invariants
        shell: bash
        run: ./scripts/ci-check.sh 'repository invariants' ./scripts/verify-repo.sh
