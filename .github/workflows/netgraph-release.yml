name: Release netgraph

on:
  push:
    tags:
      - 'netgraph/v*'

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netgraph
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
      - name: Run tests
        run: |
          cmake -B build -G Ninja
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Package Linux x64
        run: bash scripts/package.sh --target linux-x64 --output ../dist/netgraph-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: netgraph-linux-x64
          path: dist/netgraph-linux-x64.tar.gz

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: netgraph
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          cmake -B build -G Ninja
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Package macOS arm64
        run: bash scripts/package.sh --target macos-arm64 --output ../dist/netgraph-macos-arm64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: netgraph-macos-arm64
          path: dist/netgraph-macos-arm64.tar.gz

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: netgraph
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          cmake -B build -G Ninja
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Package Windows x64
        shell: bash
        run: bash scripts/package.sh --target windows-x64 --output ../dist/netgraph-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: netgraph-windows-x64
          path: dist/netgraph-windows-x64.exe

  publish:
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify tag and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}^{commit}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists" >&2
            exit 1
          fi
          test -f dist/netgraph-linux-x64.tar.gz
          test -f dist/netgraph-macos-arm64.tar.gz
          test -f dist/netgraph-windows-x64.exe
          gh release create "$GITHUB_REF_NAME" \
            dist/netgraph-linux-x64.tar.gz \
            dist/netgraph-macos-arm64.tar.gz \
            dist/netgraph-windows-x64.exe \
            --prerelease \
            --title "NetGraph v0.1.0-dev (dev beta)" \
            --notes-file netgraph/docs/RELEASE_NOTES.md
