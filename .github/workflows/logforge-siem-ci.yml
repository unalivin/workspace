name: CI logforge-siem

on:
  push:
    paths:
      - 'logforge-siem/**'
      - 'scripts/ci-check.sh'
      - 'scripts/logforge-siem-acceptance.sh'
      - 'scripts/update-logforge-audit.sh'
      - 'scripts/strip-dev-files.sh'
      - '.github/workflows/logforge-siem-ci.yml'
      - 'templates/workflows/rust-ci.yml'
  pull_request:
    paths:
      - 'logforge-siem/**'
      - 'scripts/ci-check.sh'
      - 'scripts/logforge-siem-acceptance.sh'
      - 'scripts/update-logforge-audit.sh'
      - 'scripts/strip-dev-files.sh'
      - '.github/workflows/logforge-siem-ci.yml'
      - 'templates/workflows/rust-ci.yml'

permissions:
  contents: write

concurrency:
  group: logforge-siem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: logforge-siem
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev
      - name: Format source
        run: |
          if [[ "$GITHUB_EVENT_NAME" != push ]]; then
            ../scripts/ci-check.sh 'cargo fmt' cargo fmt --all -- --check
          else
            ../scripts/ci-check.sh 'cargo fmt' cargo fmt --all
            if [[ "$RUNNER_OS" == Linux ]] && ! git diff --quiet -- .; then
              ../scripts/update-logforge-audit.sh
              git config user.name Unalivin
              git config user.email automation
              git add . ../.workspace/STATUS.md ../.workspace/audit/logforge-siem.md
              git commit -m 'style(logforge-siem): format and refresh audit'
              git push origin "$GITHUB_REF_NAME"
            fi
          fi
      - name: Format check
        run: ../scripts/ci-check.sh 'cargo fmt check' cargo fmt --all -- --check
      - name: Clippy
        run: ../scripts/ci-check.sh clippy cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: ../scripts/ci-check.sh build cargo build --workspace --no-default-features
      - name: Test (no-gui)
        run: ../scripts/ci-check.sh 'test no-gui' cargo test --workspace --no-default-features
      - name: Acceptance evidence
        if: hashFiles('logforge-siem/crates/logforge-core/tests/retention_plan_tests.rs') != ''
        run: ../scripts/ci-check.sh 'acceptance tests' bash ../scripts/logforge-siem-acceptance.sh
      - name: Test (default)
        run: ../scripts/ci-check.sh 'test default' cargo test --workspace
      - name: Shipped smoke run
        if: runner.os == 'Linux' && hashFiles('logforge-siem/crates/logforge-core/tests/retention_plan_tests.rs') == ''
        run: |
          db="$RUNNER_TEMP/logforge-siem-smoke.db"
          ../scripts/ci-check.sh 'smoke version' cargo run -p logforge-app -- --version
          ../scripts/ci-check.sh 'smoke demo load' cargo run -p logforge-app -- --db "$db" demo load
          ../scripts/ci-check.sh 'smoke overview' cargo run -p logforge-app -- --db "$db" overview
      - name: Shipped measurement
        if: runner.os == 'Linux' && hashFiles('logforge-siem/crates/logforge-core/tests/retention_plan_tests.rs') == ''
        run: ../scripts/ci-check.sh 'shipped measurement' bash -c 'cd .. && scripts/measure.sh --shipped logforge-siem'
