name: Dev evidence

on:
  push:
    branches:
      - arena/9925821e-workspace
    paths:
      - .github/dev-evidence/**

permissions:
  contents: read

concurrency:
  group: dev-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    name: collect
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            secretsentry/target
          key: dev-evidence-${{ hashFiles('secretsentry/Cargo.toml', 'secretsentry/crates/*/Cargo.toml') }}
          restore-keys: dev-evidence-
      - name: Run request
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          export EVIDENCE_DIR="$RUNNER_TEMP/evidence"
          status=0
          bash .github/dev-evidence/request.sh > "$EVIDENCE_DIR/request.log" 2>&1 || status=$?
          printf 'request exit status: %s\n' "$status" >> "$EVIDENCE_DIR/request.log"
      - name: Push evidence ref
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/evidence"
          git init -q
          git add -A
          git -c user.name=ci-evidence -c user.email=ci-evidence commit -q -m "evidence for ${GITHUB_SHA}"
          git push -q "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "+HEAD:refs/ci-evidence/latest"
